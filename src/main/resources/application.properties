server.port=8080
spring.application.name=UserAuthService

# The JDBC URL of the database (replace 'your_database_name' with your actual database name)
spring.datasource.url=jdbc:mysql://localhost:3306/user_auth_service

# Database credentials
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Automatically creates, updates, or validates the database schema based on your @Entity classes
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL queries in the console (useful for development)
spring.jpa.show-sql=true

#jwt config
jwt.secret=${JWT_SECRET}
jwt.expiration=300
