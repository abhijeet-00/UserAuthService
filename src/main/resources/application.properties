server.port=8081
spring.application.name=UserAuthService

# The JDBC URL of the database (replace 'your_database_name' with your actual database name)
spring.datasource.url=jdbc:mysql://localhost:3306/user_auth_service

# Database credentials
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Automatically creates, updates, or validates the database schema based on your @Entity classes
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL queries in the console (useful for development)
spring.jpa.show-sql=false

#jwt config
jwt.audience=shopnest-api
jwt.expiration=5000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

